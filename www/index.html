<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />

        <title>Window</title>

        <meta name="author" content="Centretown" />
        <meta name="description" content="Dave's Window" />
        <meta name="viewport" content="width=device-width" />

        <script src="static/js/htmx.js"></script>
        <script src="static/js/ws.js"></script>
        <script src="static/js/index.js"></script>

        <link rel="stylesheet" href="static/css/styles.css" />
    </head>

    <body>
        <span id="events" hx-ext="ws" ws-connect="/events">
            <span id="layout">
                <div class="viewfull source">
                    <img id="source" src="{{.WebcamUrl}}" />
                </div>
            </span>
            <span>
                <span id="slots" class="slots"></span>
            </span>
            {{ template "layout.actions" . }} {{ template "layout.chat"
            .WebSocket }} {{ template "weather.clock" . }}
            <script src="/static/js/wsstatus.js" defer></script>
        </span>
    </body>
</html>
